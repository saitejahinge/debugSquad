<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 10. Show First 3 Products from Array
Only display the first 3 products in a ul, even if array has more than 3 items. -->
</body>

<ul id="tony">

</ul>

<script>

let product=["apple","lg","sony","mi","nokia","hp"];

let man=document.getElementById("tony") 

for(i=0; i<3; i++){
     man.innerHTML+=`<li> ${product[i]} </li>`
}



</script>

</html>
