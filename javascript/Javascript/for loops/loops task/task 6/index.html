    <!-- 6. Countdown Display
Use a while loop to count down from 10 to 1 and display in a <div>. -->


<section id="division">

</section>  

 

<script>
 let i=1;
    let tony= document.getElementById("division")
    while( i<=10 ) {

        tony.innerHTML+=`<div class="tony"
        > ${i} </div>`
        i++}
    
</script>
