   <!-- 7. Find Item Until Match
Loop through product names until you find “Camera”. Stop the loop once found.  -->


<div id="tony">

</div>

<script>

let product=["apple","fan","camera","car"]

 for(i=0; i<product.length; i++){
    let pr="";
    if(product[i]!="camera"){
        pr+=product[i]; 
        document.write("  "+pr+" ")  
    }
    else{
        document.write("Camera Found")
        break; 
    }
    // document.write(pr)
}



</script>
