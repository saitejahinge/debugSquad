<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 9</title>
</head>

<body>
    <!-- 9. Show Stock-Based Product List
From a product array, display names until stock becomes 0 using while. -->

    <script>
        let product = [{ name: "apple", stock: 100 }, { name: "laptop", stock: 50 },
         { name: "phone", stock: 8 },
         { name: "fridge", stock: 0 }
        ];
        for (i = 0; i<product.length; i++) {
            while (product[i].stock > 0) {
                document.write(product[i].name + "<br>");
                product[i].stock--;
            }
        }
    </script>

</body>

</html>
